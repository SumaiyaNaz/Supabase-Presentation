<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <div class="contact-container">
    <!-- Form Section -->
    <div class="form-column">
      <form action="#" method="POST">
        <div class="form-row">
          <div class="input-group">
            <label for="first-name">FIRST NAME</label>
            <input type="text" id="first-name" name="first-name" placeholder="First Name" required />
          </div>

          <div class="input-group">
            <label for="last-name">LAST NAME</label>
            <input type="text" id="last-name" name="last-name" placeholder="Last Name" required />
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email"  placeholder="Email" required />
          </div>

          <div class="input-group">
            <label for="phone">PHONE NUMBER</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone number" />
          </div>
        </div>

        <div class="input-group full-width">
          <label for="query">WHAT DO YOU HAVE IN MIND</label>
          <textarea
            id="query"
            name="query"
            rows="6"
            placeholder="Please enter query..."
          ></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- Contact Details Section -->
    <div class="details-column">
      <h1 class="contact-title">Contact Us</h1>

      <p class="contact-description">
        We’d love to hear from you! Whether you have a question about an order,
        need beauty advice, or want to learn more about our products — our team
        is always here to help.
      </p>

      <div class="contact-info">
        <div class="info-item">
          <span class="icon">&#9742;</span>
          <span>+123 456 789</span>
        </div>
        <div class="info-item">
          <span class="icon">&#9993;</span>
          <span>example@gmail.com</span>
        </div>
        <div class="info-item">
          <span class="icon">&#9906;</span>
          <span>ABC Street</span>
        </div>
      </div>

      <div class="social-icons">
        <a href="#" aria-label="Google"><i class="fab fa-google"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
