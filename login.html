<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .label-font{
        font-size: 13px;
      }
      .small-placeholder::placeholder {
    font-size: 13px;
    padding-left: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid d-flex justify-content-center align-items-center vh-100 bg-white">
      <div class="p-0 d-flex justify-content-center rounded-4"  style="color: #0D3b66; border: 1.5px solid #0D3b66;">
        <form id="loginForm" class="p-4">
          <h3 class="fw-bold mb-4 text-center">Sign In</h3>
          <div class="mb-3 d-flex flex-nowrap gap-4">            
            <input class="form-control small-placeholder" placeholder="Email Address" type="email" class="form-control" id="loginEmail" aria-describedby="emailHelp" style="width: 250px; height: 35px;"/>
          </div>
          <div class="mb-3 d-flex flex-nowrap gap-3">            
            <input class="form-control small-placeholder" placeholder="Password" type="password" class="form-control" id="loginPassword" style="width: 250px; height: 35px;" />
          </div>
         <div class="d-flex flex-column justify-content-center align-items-center">
          <button type="submit" class="btn text-light fw-bold mb-1" style="background-color: #0D3b66;">Sign in</button>
          <p class="">Don't have an account <a href="signup.html" class="text-decoration-none text-primary">Sign up</a></p>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="config.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
